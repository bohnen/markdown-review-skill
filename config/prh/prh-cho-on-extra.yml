meta:
  - title: 外来語カタカナ表記（長音）の追補
  - memo: ics 辞書 dict/prh_cho_on.yml の方針「-er, -or, -ar で終わる語は長音を付ける」を、辞書に無い語へ拡張する。書式は dict/prh_cho_on.yml と同じ

rules:
  - pattern: /サーバ(?!([ーァ-ヴ]))/
    expected: サーバー
    prh: 語尾が -er, -or, -ar で終わる語彙には長音を付けます（外来語カタカナ表記）

  - pattern: /ユーザ(?!([ーァ-ヴ]))/
    expected: ユーザー
    prh: 語尾が -er, -or, -ar で終わる語彙には長音を付けます（外来語カタカナ表記）

  - pattern: /リーダ(?!([ーァ-ヴ]))/
    expected: リーダー
    prh: 語尾が -er, -or, -ar で終わる語彙には長音を付けます（外来語カタカナ表記）

  - pattern: /フォロワ(?!([ーァ-ヴ]))/
    expected: フォロワー
    prh: 語尾が -er, -or, -ar で終わる語彙には長音を付けます（外来語カタカナ表記）

  - pattern: /エントリ(?!([ーァ-ヴ]))/
    expected: エントリー
    prh: 語尾が -y で終わる語も「エントリー」と長音を付けます（外来語カタカナ表記）
