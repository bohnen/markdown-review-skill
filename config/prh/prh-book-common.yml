meta:
  - title: 書籍原稿共通の表記ルール（出版社の表記統一指示を prh 化したもの）
  - memo: ics 辞書（dict/）と重複する語は入れない。dict/ に無い語だけを追補する

rules:
  # ---- ひらく漢字（出版社指示） ----
  - expected: など
    pattern: /(?<![同平高対均上劣優初中一二三四五六七八九十])等(?=[はがをにでのもと、。）])/
    prh: 「等」は「など」とひらく（ひらく漢字）
  - expected: とおり
    pattern: /(?<!一|ひと|大|見)通り/
    prh: 「次のとおり」のように「とおり」とひらく（ひらく漢字）
  - expected: $1たち
    pattern: /(私|僕|筆者|読者|人|者|子供)達/
    specs:
      - from: 筆者達
        to: 筆者たち
    prh: 「たち」とひらく（ひらく漢字）
  - expected: つなが
    pattern: 繋が
    prh: 「つなが」とひらく（ひらく漢字）
  - expected: $1ため
    pattern: /(の|る|た|い)為/
    specs:
      - from: その為
        to: そのため
    prh: 「ため」とひらく（ひらく漢字）
  - expected: なし
    pattern: 無し
    prh: 「なし」とひらく（ひらく漢字）
  - expected: ほか
    pattern: /(?<!その|自|排)他(?=の|に|は|も|、)/
    specs:
      - from: 他の方法
        to: ほかの方法
      - from: その他の方法
        to: その他の方法
    prh: 「ほか」とひらく。「その他」だけは漢字のまま（ひらく漢字）
  - expected: うえで
    pattern: 上で
    prh: 位置関係を表すとき以外は「うえで」とひらく（ひらく漢字）
  - expected: ごとに
    pattern: 毎に
    prh: 「ごとに」とひらく（ひらく漢字）
  - expected: わか$1
    pattern: /分か(り|っ)/
    prh: 意味がわかる、の意味では「わかる」とひらく。二つに分ける、は漢字のまま（ひらく漢字）
  - expected: とき
    pattern: /(?<=[るいたうくすつぬむぐぶず])時(?=に|は|、|の)/
    specs:
      - from: 起動する時に
        to: 起動するときに
    prh: 「〜するとき」は「とき」とひらく（ひらく漢字）

  # ---- 閉じる漢字・送り仮名（出版社指示） ----
  - expected: 先ほど
    pattern: /(先程|さきほど)/
    prh: 「先ほど」に統一（閉じる漢字）
  - expected: 行$1
    pattern: /行な(う|い|っ|わ|え)/
    prh: 送り仮名の「な」は付けない（「行う」）
  - expected: 表$1
    pattern: /表わ(す|し|さ|せ)/
    prh: 送り仮名は「表す」に統一

  # ---- 重言（出版社指示。「まず最初に」は dict/prh_duplicate.yml が扱う） ----
  - expected: $1ごと
    pattern: /各([ぁ-んァ-ヶー一-龥a-zA-Z]+?)ごと/
    specs:
      - from: 各ノードごと
        to: ノードごと
    prh: 「各〜ごと」は重言。「〜ごと」だけにする（重言）
  - expected: 追加する
    pattern: あとから追加する
    prh: 「あとから」は重言（重言）

  # ---- 呼称・語の統一（出版社指示） ----
  - expected: 皆さん
    pattern: みなさん
    prh: 読者への呼びかけは「皆さん」に統一
  - expected: アプリケーション
    pattern: /アプリ(?!ケーション)/
    prh: 略語は使わず「アプリケーション」に統一
